name: monitor

on:
  schedule:
    - cron: "*/15 * * * *"  # UTC; GitHub may start runs 5-20+ minutes late
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print messages instead of sending them; don't save state"
        type: boolean
        default: false
      selftest:
        description: "Only send one Telegram test message"
        type: boolean
        default: false

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write  # push state.json to the `state` branch
  actions: write   # keepalive: re-enable this workflow once a month

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check out the state branch into state-data/
        run: |
          if git ls-remote --exit-code --heads origin state >/dev/null 2>&1; then
            git fetch -q --depth 1 origin state:state
            git worktree add -q state-data state
            echo "state branch found"
          else
            git worktree add -q --orphan -b state state-data
            echo "no state branch yet: first run, starting fresh"
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          SELFTEST: ${{ inputs.selftest }}
        run: |
          args="--state state-data/state.json"
          [ "$DRY_RUN" = "true" ] && args="$args --dry-run"
          [ "$SELFTEST" = "true" ] && args="$args --selftest"
          python -m monitor.main $args

      - name: Keepalive (re-enable this workflow every 30 days)
        if: always() && inputs.dry_run != true && inputs.selftest != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=state-data/state.json
          [ -f "$f" ] || exit 0
          last=$(jq -r '.keepalive // ""' "$f")
          if [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt $(( 30 * 86400 )) ]; then
            echo "keepalive not due (last: $last)"; exit 0
          fi
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/monitor.yml/enable" --silent
          jq --arg t "$(date -u +%FT%TZ)" '.keepalive = $t' "$f" > "$f.tmp" && mv "$f.tmp" "$f"
          echo "keepalive done"

      - name: Save state to the state branch (only if it changed)
        if: always() && inputs.dry_run != true && inputs.selftest != true
        run: |
          cd state-data
          [ -f state.json ] || { echo "no state file written"; exit 0; }
          # last_check changes every run; ignore it so the branch only gets real changes
          if git cat-file -e HEAD:state.json 2>/dev/null &&
             [ "$(git show HEAD:state.json | jq -S 'del(.last_check)')" = "$(jq -S 'del(.last_check)' state.json)" ]; then
            echo "state unchanged"; exit 0
          fi
          git add state.json
          [ -f state.corrupt.json ] && git add state.corrupt.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "state: $(date -u +%FT%TZ)"
          git push -q origin state
          echo "state saved"
