# Settings and cinemas. Movies and dates are NOT set here:
# send them to the bot in Telegram, e.g. /watch dune 23 Dec (send /help for more).

settings:
  timezone: Africa/Cairo
  heartbeat_hour: 9          # daily "alive" message, Cairo time
  error_alert_after: 3       # failed runs in a row before a problem alert
  notify_new_showtimes: true # also alert when an open movie gets new showtimes

cinemas:                     # branch = the part before .scenecinemas.com
  - id: scene-cfc
    provider: scene
    branch: cfc
    name: Scene Cairo Festival City
  - id: scene-district5
    provider: scene
    branch: district5
    name: Scene District 5
